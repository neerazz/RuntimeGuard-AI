version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: runtimeguard-api
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: runtimeguard-dashboard
    ports:
      - "5173:4173"
    depends_on:
      - api
