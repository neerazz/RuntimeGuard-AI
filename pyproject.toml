[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runtimeguard-ai"
version = "0.1.0"
description = "RuntimeGuard-AI: reference implementation for attested AI oversight"
authors = [
  { name = "RuntimeGuard-AI Contributors" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.1",
  "python-multipart>=0.0.7",
  "httpx>=0.27.0",
  "uvloop>=0.19.0; platform_system != 'Windows'",
  "orjson>=3.10.0",
  "jinja2>=3.1.3",
  "typer>=0.12.3",
  "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.23.0",
  "anyio>=4.3.0",
  "matplotlib>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"src.core" = ["schema.sql"]
