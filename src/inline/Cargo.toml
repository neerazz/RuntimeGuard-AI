[package]
name = "runtimeguard-inline"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0.103"
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
regex = "1.0"
sha2 = "0.10"
ed25519-dalek = "3.0.0"
fs2 = "0.4.3"

[dev-dependencies]
tempfile = "3.23"
