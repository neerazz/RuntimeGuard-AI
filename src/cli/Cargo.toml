[package]
name = "runtimeguard-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "runtimeguard"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = "3.0.0"
getrandom = "0.2"
runtimeguard-inline = { path = "../inline" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.23"
