[package]
name = "runtimeguard-attestor"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-ff = "0.4.0"
ark-ec = "0.4.0"
ark-bls12-381 = "0.4.0"
ark-groth16 = "0.4.0"
ark-snark = "0.4.0"
ark-std = "0.4.0"
ark-relations = "0.4.0"
ark-r1cs-std = "0.4.0"
ark-serialize = "0.4.0"
rand = "0.8.0"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
sha2 = "0.10"

[[bin]]
name = "bench_prove"
path = "src/bin/bench_prove.rs"
